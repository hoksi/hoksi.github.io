<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>대신맨 스네이크 · 그래! 만들어보자</title>
<meta name="description" content="대신맨이 아이디어를 먹고 길어집니다. 벽과 내 꼬리만 조심!">
<style>
:root{--bg:#f6f4ef;--fg:#2d2a26;--mut:#7a746b;--card:#fffdf9;--btn:#2f6fed;--btnfg:#fff;--line:#d9d2c6}
@media (prefers-color-scheme:dark){:root{--bg:#17161a;--fg:#ece7df;--mut:#a39d93;--card:#221f24;--btn:#5b8cff;--btnfg:#0d0d10;--line:#3a3631}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--fg);font-family:-apple-system,"Noto Sans KR","Apple SD Gothic Neo",sans-serif}
main{max-width:480px;margin:0 auto;padding:16px}
header{display:flex;align-items:flex-end;justify-content:space-between;gap:8px;margin-bottom:10px}
h1{font-size:22px;margin:0;line-height:1.2}h1 small{display:block;font-size:13px;color:var(--mut);font-weight:400;margin-top:2px}
.scores{display:flex;gap:6px}.sc{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:4px 10px;text-align:center;min-width:64px}
.sc b{display:block;font-size:18px}.sc span{font-size:11px;color:var(--mut)}
.stage{position:relative;width:100%;aspect-ratio:1;border-radius:12px;overflow:hidden;background:#20232e;touch-action:none;user-select:none}
canvas{display:block;width:100%;height:100%;image-rendering:pixelated}
.ov{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;background:rgba(10,10,20,.6);color:#fff;text-align:center;padding:16px}
.ov.hide{display:none}.ov h2{margin:0;font-size:24px}.ov p{margin:0;opacity:.9;font-size:14px}
button{font:inherit;border:0;border-radius:999px;padding:8px 14px;background:var(--btn);color:var(--btnfg);font-weight:600;cursor:pointer}
button.ghost{background:transparent;color:var(--fg);border:1px solid var(--line)}
.bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:10px}
.pad{display:grid;grid-template-columns:repeat(3,64px);grid-template-rows:repeat(2,52px);gap:6px;justify-content:center;margin-top:12px}
.pad button{border-radius:12px;font-size:22px;padding:0;background:var(--card);color:var(--fg);border:1px solid var(--line)}
.pad .up{grid-column:2}.pad .left{grid-column:1;grid-row:2}.pad .down{grid-column:2;grid-row:2}.pad .right{grid-column:3;grid-row:2}
.card{margin-top:12px;background:var(--card);border-radius:12px;padding:12px;font-size:13px;color:var(--mut);line-height:1.7}
footer{margin-top:14px;font-size:12px;color:var(--mut);text-align:center;line-height:1.6}footer a{color:var(--btn)}
</style>
</head>
<body>
<main>
  <header>
    <h1>대신맨 스네이크<small>아이디어를 먹고 길어지기</small></h1>
    <div class="scores"><div class="sc"><span>점수</span><b id="score">0</b></div><div class="sc"><span>최고</span><b id="best">0</b></div></div>
  </header>
  <div class="stage"><canvas id="cv" width="400" height="400"></canvas>
    <div class="ov" id="ov"><h2 id="ot">대신맨 스네이크</h2><p id="op">밀거나 방향키를 눌러 출발!</p><button id="go">시작</button></div></div>
  <div class="pad" aria-label="방향 버튼"><button class="up" data-d="up">▲</button><button class="left" data-d="left">◀</button>
    <button class="down" data-d="down">▼</button><button class="right" data-d="right">▶</button></div>
  <div class="bar"><button class="ghost" id="sfx">🔊 효과음</button><button class="ghost" id="bgmbtn">🎵 배경음 끔</button><button class="ghost" id="pause">⏸ 잠깐</button></div>
  <div class="card">💡 아이디어를 먹으면 한 칸 길어지고 점점 빨라져요. 가끔 나오는 ⭐ 반짝 아이디어는 사라지기 전에 먹으면 보너스!
    꼬리는 만드는 단계 색으로 물들어요: 아이디어 → 메모 → 설계 → 코딩 → … 벽이나 내 꼬리에 부딪히면 끝.</div>
  <footer><a href="/">그래 만들어보자! 블로그</a> · <a href="/games/2048/">2048</a> · <a href="/games/runner/">러너</a><br>
    배경음: Meta MusicGen(small)으로 만든 곡, 비상업적 이용</footer>
</main>
<script>
"use strict";
// 대신맨 스네이크 for hoksi.github.io (2026-10-30). Plain canvas, no libraries. Grid snake with a buffered direction
// queue (two quick turns in one tick work, reversing is ignored), speed-up per idea, timed bonus star.
const $ = id => document.getElementById(id);
const store = {get(k, d) { try { const v = localStorage.getItem("snake_" + k); return v === null ? d : JSON.parse(v); } catch (e) { return d; } },
               set(k, v) { try { localStorage.setItem("snake_" + k, JSON.stringify(v)); } catch (e) {} }};
const N = 20, cv = $("cv"), g = cv.getContext("2d"), C = cv.width / N;
// tail colours follow the maker stages of the 2048 game
const STAGE = ["#fff4c2", "#ffe7a8", "#ffd59a", "#ffc08a", "#ffab84", "#ff9a7a", "#c8e6a0", "#a7dba0", "#8fd3c9", "#8fc0f0", "#c3a6ff"];
const seedParam = new URLSearchParams(location.search).get("seed");
let seed = seedParam ? Number(seedParam) >>> 0 : 0;
const rand = () => seedParam ? ((seed = (seed * 1664525 + 1013904223) >>> 0) / 4294967296) : Math.random();
let snake, dir, queue, food, star, score, best = store.get("best", 0), eaten, tick, acc, last, state = "ready", raf;
$("best").textContent = best;

// ---- sound (Web Audio synth effects; background loop through Web Audio so it has no gap at the wrap)
let actx = null, sfxOn = store.get("sfx", true), bgmOn = false, bgmBuf = null, bgmSrc = null, bgmGain = null;
function ac() { if (!actx) { const A = window.AudioContext || window.webkitAudioContext; if (A) actx = new A(); } if (actx && actx.state === "suspended") actx.resume(); return actx; }
function tone(f, start, dur, type = "square", vol = 0.05, to = null) {
  if (!sfxOn) return; const a = ac(); if (!a) return;
  const t0 = a.currentTime + start, o = a.createOscillator(), gn = a.createGain();
  o.type = type; o.frequency.setValueAtTime(f, t0); if (to) o.frequency.exponentialRampToValueAtTime(to, t0 + dur);
  gn.gain.setValueAtTime(0.0001, t0); gn.gain.exponentialRampToValueAtTime(vol, t0 + 0.008); gn.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
  o.connect(gn).connect(a.destination); o.start(t0); o.stop(t0 + dur + 0.02);
}
const sfx = {eat: n => tone(440 * Math.pow(2, (n % 12) / 12), 0, 0.08, "square", 0.05, 880 * Math.pow(2, (n % 12) / 12)),
             star: () => [784, 988, 1175, 1568].forEach((f, i) => tone(f, i * 0.05, 0.1, "square", 0.04)),
             turn: () => tone(220, 0, 0.02, "triangle", 0.02), over: () => [392, 311, 262, 196].forEach((f, i) => tone(f, i * 0.12, 0.2, "triangle", 0.07))};
async function bgmStart() {
  const a = ac(); if (!a) throw new Error("no audio");
  if (!bgmBuf) bgmBuf = await a.decodeAudioData(await (await fetch("bgm.ogg")).arrayBuffer());
  bgmGain = bgmGain || a.createGain(); bgmGain.gain.value = 0.28; bgmGain.connect(a.destination);
  bgmSrc = a.createBufferSource(); bgmSrc.buffer = bgmBuf; bgmSrc.loop = true; bgmSrc.connect(bgmGain); bgmSrc.start();
}
function bgmStop() { if (bgmSrc) { try { bgmSrc.stop(); } catch (e) {} bgmSrc = null; } }
function soundButtons() { $("sfx").textContent = sfxOn ? "🔊 효과음" : "🔇 효과음 끔"; $("bgmbtn").textContent = bgmOn ? "🎵 배경음 켬" : "🎵 배경음 끔"; }
$("sfx").onclick = () => { sfxOn = !sfxOn; store.set("sfx", sfxOn); soundButtons(); };
$("bgmbtn").onclick = () => { bgmOn = !bgmOn; if (bgmOn) bgmStart().catch(() => { bgmOn = false; soundButtons(); }); else bgmStop(); soundButtons(); };
soundButtons();

// ---- game
const DIRS = {up: [0, -1], down: [0, 1], left: [-1, 0], right: [1, 0]};
const OPP = {up: "down", down: "up", left: "right", right: "left"};
function freeCell() {
  for (let i = 0; i < 500; i++) {
    const c = [Math.floor(rand() * N), Math.floor(rand() * N)];
    if (!snake.some(s => s[0] === c[0] && s[1] === c[1]) && !(food && food[0] === c[0] && food[1] === c[1])) return c;
  }
  return null;
}
function reset() {
  snake = [[6, 10], [5, 10], [4, 10]]; dir = "right"; queue = []; score = 0; eaten = 0; tick = 0.16; acc = 0; star = null; food = null;
  food = freeCell(); $("score").textContent = 0; draw();
}
function start() { if (state === "play") return; if (state !== "paused") reset(); state = "play"; $("ov").classList.add("hide"); ac(); last = performance.now(); loop(last); }
function turn(d) {
  if (state === "ready" || state === "over") { start(); }
  const lastDir = queue.length ? queue[queue.length - 1] : dir;
  if (d !== lastDir && d !== OPP[lastDir] && queue.length < 2) { queue.push(d); sfx.turn(); }
}
function step() {
  if (queue.length) dir = queue.shift();
  const [dx, dy] = DIRS[dir], h = snake[0], nh = [h[0] + dx, h[1] + dy];
  const eats = nh[0] === food[0] && nh[1] === food[1];
  const body = eats ? snake : snake.slice(0, -1);                 // the tail moves away unless we grow
  if (nh[0] < 0 || nh[1] < 0 || nh[0] >= N || nh[1] >= N || body.some(s => s[0] === nh[0] && s[1] === nh[1])) return over();
  snake.unshift(nh);
  if (eats) {
    eaten++; score += 10; sfx.eat(eaten); food = freeCell(); tick = Math.max(0.065, tick * 0.97);
    if (!star && eaten % 5 === 0) { const c = freeCell(); if (c) star = {c, left: 6}; }
  } else snake.pop();
  if (star && nh[0] === star.c[0] && nh[1] === star.c[1]) { score += 50; sfx.star(); star = null; }
  $("score").textContent = score;
  if (!food) return over(true);                                  // board full
}
function over(won) {
  state = "over"; cancelAnimationFrame(raf); sfx.over();
  const record = score > best; if (record) { best = score; store.set("best", best); $("best").textContent = best; }
  $("ot").textContent = won ? "🎉 화면을 다 채웠어요!" : record ? `새 기록! ${score}점` : "꼬리가 엉켰어요";
  $("op").textContent = `점수 ${score} · 길이 ${snake.length} · 다시 하려면 밀거나 시작`;
  $("go").textContent = "다시 하기"; $("ov").classList.remove("hide"); draw();
}
function loop(now) {
  if (state !== "play") return;
  const dt = Math.min(0.1, (now - last) / 1000); last = now; acc += dt;
  if (star) { star.left -= dt; if (star.left <= 0) star = null; }
  while (acc >= tick && state === "play") { acc -= tick; step(); }
  draw(); raf = requestAnimationFrame(loop);
}
function cell(x, y, color, inset = 1) { g.fillStyle = color; g.fillRect(x * C + inset, y * C + inset, C - 2 * inset, C - 2 * inset); }
function draw() {
  g.fillStyle = "#20232e"; g.fillRect(0, 0, cv.width, cv.height);
  g.fillStyle = "#262a37"; for (let y = 0; y < N; y++) for (let x = (y % 2); x < N; x += 2) g.fillRect(x * C, y * C, C, C);
  // idea bulb
  if (food) { const [x, y] = food; cell(x, y, "#ffd166", 3); g.fillStyle = "#fff8d6"; g.fillRect(x * C + 6, y * C + 6, 4, 4); g.fillStyle = "#9a9a9a"; g.fillRect(x * C + 7, y * C + C - 6, C - 14, 3); }
  if (star) { const [x, y] = star.c; const blink = star.left < 2 && Math.floor(star.left * 6) % 2;
    if (!blink) { g.fillStyle = "#fff"; g.font = `${C - 2}px sans-serif`; g.textAlign = "center"; g.textBaseline = "middle"; g.fillText("⭐", x * C + C / 2, y * C + C / 2 + 1); } }
  // tail in maker-stage colours, head = 대신맨 (blue suit, face toward the direction, red cape)
  for (let i = snake.length - 1; i >= 1; i--) cell(snake[i][0], snake[i][1], STAGE[Math.min(STAGE.length - 1, Math.floor((i - 1) / 3))], 2);
  const [hx, hy] = snake[0], [dx, dy] = DIRS[dir];
  cell(hx, hy, "#2f6fed", 1);
  g.fillStyle = "#f2c9a0"; g.fillRect(hx * C + 4, hy * C + 4, C - 8, C - 8);
  g.fillStyle = "#2d2a26";                                       // two eyes on the side the head faces
  const fx = dx > 0 ? C - 8 : dx < 0 ? 6 : null, fy = dy > 0 ? C - 8 : dy < 0 ? 6 : null;
  const eyes = fx !== null ? [[fx, 6], [fx, C - 8]] : [[6, fy], [C - 8, fy]];
  for (const [ex, ey] of eyes) g.fillRect(hx * C + ex, hy * C + ey, 2, 2);
  g.fillStyle = "#e5484d"; g.fillRect(hx * C + C / 2 - dx * (C / 2) - 2, hy * C + C / 2 - dy * (C / 2) - 2, 4, 4);
}

// ---- input: keys, swipes on the board, on-screen pad
const KEYS = {ArrowUp: "up", ArrowDown: "down", ArrowLeft: "left", ArrowRight: "right", w: "up", s: "down", a: "left", d: "right"};
document.addEventListener("keydown", e => { const d = KEYS[e.key]; if (d) { e.preventDefault(); turn(d); } else if (e.key === " ") { e.preventDefault(); state === "play" ? pause() : start(); } });
let sx = null, sy = null;
cv.addEventListener("pointerdown", e => { sx = e.clientX; sy = e.clientY; });
cv.addEventListener("pointerup", e => { if (sx === null) return; const dx = e.clientX - sx, dy = e.clientY - sy; sx = sy = null;
  if (Math.max(Math.abs(dx), Math.abs(dy)) < 20) return; turn(Math.abs(dx) > Math.abs(dy) ? (dx > 0 ? "right" : "left") : (dy > 0 ? "down" : "up")); });
document.querySelectorAll(".pad button").forEach(b => b.addEventListener("pointerdown", e => { e.preventDefault(); turn(b.dataset.d); }));
function pause() { if (state !== "play") return; state = "paused"; cancelAnimationFrame(raf); $("ot").textContent = "잠깐 쉬는 중"; $("op").textContent = "계속하려면 시작"; $("go").textContent = "계속"; $("ov").classList.remove("hide"); }
$("pause").onclick = () => state === "play" ? pause() : start();
$("go").onclick = () => start();
document.addEventListener("visibilitychange", () => { if (document.hidden) pause(); });
reset();
window.__snake = {get state() { return state; }, get snake() { return snake; }, get food() { return food; }, set food(v) { food = v; },
                  get score() { return score; }, turn, start, step, get tick() { return tick; }};
</script>
</body>
</html>
